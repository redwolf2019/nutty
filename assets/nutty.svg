<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="nutBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d59a68"/>
      <stop offset="1" stop-color="#a05e2c"/>
    </linearGradient>
    <linearGradient id="nutCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e4424"/>
      <stop offset="1" stop-color="#542d13"/>
    </linearGradient>
    <linearGradient id="nutLeaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bc34a"/>
      <stop offset="1" stop-color="#558b2f"/>
    </linearGradient>
  </defs>

  <!-- The dark parts of the acorn get a cream outline so they stay
       visible on the black tile the icon sits on. -->
  <g transform="rotate(16 512 512)">
    <!-- nut body: a rounded chestnut -->
    <path d="M 512 920 C 300 920 190 770 190 560 C 190 380 300 262 512 262 C 724 262 834 380 834 560 C 834 770 724 920 512 920 Z" fill="url(#nutBody)"/>

    <!-- cap with scalloped edge, cupping the top -->
    <path d="M 188 470 C 188 292 302 228 512 228 C 722 228 836 292 836 470 Q 786 508 746 462 Q 708 508 668 462 Q 630 508 590 462 Q 552 508 512 462 Q 472 508 432 462 Q 394 508 354 462 Q 316 508 276 462 Q 230 502 188 470 Z" fill="url(#nutCap)" stroke="#f0dcc0" stroke-width="10"/>

    <!-- stem, cream rim under the brown -->
    <path d="M 512 228 Q 512 190 498 168" stroke="#f0dcc0" stroke-width="30" fill="none" stroke-linecap="round"/>
    <path d="M 512 228 Q 512 190 498 168" stroke="#6e4424" stroke-width="20" fill="none" stroke-linecap="round"/>

    <!-- little leaf -->
    <path d="M 496 168 C 434 138 382 156 360 182 C 400 208 458 206 496 168 Z" fill="url(#nutLeaf)" stroke="#f0dcc0" stroke-width="8"/>
    <path d="M 380 182 C 420 178 456 172 488 172" stroke="#558b2f" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
